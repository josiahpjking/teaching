project:
  type: website
  render: 
    - "*.qmd"
  output-dir: ../docs/ch_drafts/

website:
  title: "reading drafts"
  sidebar:
    style: "floating"
    search: true
    collapse-level: 1
    contents:
      - 17_build.qmd


format:
  live-html:
    toc: true
    toc_float: true
    code-annotations: hover
    link-citations: true
    theme: 
      - united
      - assets/style-labs.scss
      - assets/active/_style.scss
      - assets/active/_webex.scss
    include-after-body: 
      - assets/active/_webex.js
      - assets/active/_displayall.js
    include-in-header: 
      - "assets/toggling.html"
      - text: |
          <link rel="stylesheet" href="https://uoepsy.github.io/assets/css/ccfooter.css" />
    number-sections: false
webr: 
  packages: ['learnr']


